version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: affplatform-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/affplatform.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-15}
    volumes:
      - db_data:/data
    ports:
      - "4000:4000"
    networks:
      - affnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost}
    container_name: affplatform-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - affnet

volumes:
  db_data:

networks:
  affnet:
    driver: bridge
